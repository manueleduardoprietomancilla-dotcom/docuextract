<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuExtract AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      padding: 20px 40px;
      border-bottom: 1px solid #2d3748;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .logo {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(90deg, #4fc3f7, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header .tagline {
      font-size: 13px;
      color: #718096;
      margin-left: auto;
      margin-right: 14px;
    }

    .lang-switcher {
      display: flex;
      gap: 4px;
      background: #0f0f1a;
      border-radius: 8px;
      padding: 4px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: #718096;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lang-btn.active {
      background: #4fc3f7;
      color: #0f0f1a;
    }

    .lang-btn:hover:not(.active) { color: #e2e8f0; }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .hero {
      text-align: center;
      margin-bottom: 40px;
    }

    .hero h1 {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #4fc3f7, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p { color: #718096; font-size: 16px; }

    .api-key-section {
      background: #1a1a2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .api-key-section label {
      display: block;
      font-size: 13px;
      color: #a78bfa;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .api-key-row { display: flex; gap: 10px; }

    .api-key-row input {
      flex: 1;
      background: #0f0f1a;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 10px 14px;
      color: #e2e8f0;
      font-size: 14px;
      font-family: monospace;
    }

    .api-key-row input:focus { outline: none; border-color: #4fc3f7; }

    .btn-save {
      background: #4fc3f7;
      color: #0f0f1a;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s;
    }

    .btn-save:hover { opacity: 0.85; }

    .upload-area {
      background: #1a1a2e;
      border: 2px dashed #2d3748;
      border-radius: 16px;
      padding: 60px 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 24px;
    }

    .upload-area:hover, .upload-area.dragover {
      border-color: #4fc3f7;
      background: #1e2a3a;
    }

    .upload-icon { font-size: 48px; margin-bottom: 16px; }
    .upload-area h2 { font-size: 20px; margin-bottom: 8px; color: #e2e8f0; }
    .upload-area p { color: #718096; font-size: 14px; }

    .upload-area .formats {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .badge {
      background: #2d3748;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      color: #a0aec0;
    }

    #fileInput { display: none; }

    .processing {
      display: none;
      text-align: center;
      padding: 40px;
      background: #1a1a2e;
      border-radius: 16px;
      margin-bottom: 24px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid #2d3748;
      border-top-color: #4fc3f7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .results { display: none; }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .results-header h2 { font-size: 20px; font-weight: 600; }

    .btn-export {
      background: linear-gradient(135deg, #4fc3f7, #a78bfa);
      color: #0f0f1a;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s;
    }

    .btn-export:hover { opacity: 0.85; }

    .btn-new {
      background: transparent;
      color: #4fc3f7;
      border: 1px solid #4fc3f7;
      border-radius: 8px;
      padding: 10px 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      margin-right: 10px;
      transition: all 0.2s;
    }

    .btn-new:hover { background: #4fc3f720; }

    .card {
      background: #1a1a2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #4fc3f7;
      margin-bottom: 14px;
    }

    .field-row {
      display: flex;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #2d374830;
    }

    .field-row:last-child { border-bottom: none; }

    .field-label {
      min-width: 160px;
      font-size: 13px;
      color: #718096;
      font-weight: 500;
    }

    .field-value { font-size: 13px; color: #e2e8f0; flex: 1; }

    .doc-type-badge {
      display: inline-block;
      background: linear-gradient(135deg, #4fc3f720, #a78bfa20);
      border: 1px solid #4fc3f740;
      color: #4fc3f7;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }

    th {
      text-align: left;
      padding: 8px 12px;
      background: #16213e;
      color: #a78bfa;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
    }

    td {
      padding: 8px 12px;
      border-bottom: 1px solid #2d374840;
      color: #e2e8f0;
    }

    tr:last-child td { border-bottom: none; }

    .error-msg {
      background: #2d1515;
      border: 1px solid #c53030;
      color: #fc8181;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }

    .summary-text {
      color: #a0aec0;
      font-size: 14px;
      font-style: italic;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">⚡ DocuExtract AI</div>
  <div class="tagline" id="tagline">Powered by Claude AI</div>
  <div class="lang-switcher">
    <button class="lang-btn active" onclick="setLang('en')">EN</button>
    <button class="lang-btn" onclick="setLang('es')">ES</button>
    <button class="lang-btn" onclick="setLang('pt')">PT</button>
    <button class="lang-btn" onclick="setLang('fr')">FR</button>
  </div>
</header>

<div class="container">

  <div class="hero">
    <h1 id="heroTitle">Extract data from any document</h1>
    <p id="heroSubtitle">Upload invoices, contracts, receipts or any business document — AI extracts all relevant data instantly</p>
  </div>

  <div class="api-key-section">
    <label id="apiKeyLabel">Anthropic API Key</label>
    <div class="api-key-row">
      <input type="password" id="apiKeyInput" placeholder="sk-ant-..." />
      <button class="btn-save" id="btnSave" onclick="saveApiKey()">Save</button>
    </div>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
    <div class="upload-icon">📄</div>
    <h2 id="uploadTitle">Drop your document here</h2>
    <p id="uploadSubtitle">or click to browse files</p>
    <div class="formats">
      <span class="badge">PDF</span>
      <span class="badge">JPG</span>
      <span class="badge">PNG</span>
      <span class="badge">WEBP</span>
    </div>
    <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,.webp,.gif" />
  </div>

  <div class="processing" id="processing">
    <div class="spinner"></div>
    <p id="processingText" style="color:#718096;">AI is analyzing your document...</p>
  </div>

  <div class="results" id="results">
    <div class="results-header">
      <h2 id="resultsTitle">Extracted Data</h2>
      <div>
        <button class="btn-new" id="btnNew" onclick="resetApp()">+ New Document</button>
        <button class="btn-export" id="btnExport" onclick="exportExcel()">⬇ Export Excel</button>
      </div>
    </div>
    <div id="resultsContent"></div>
  </div>

</div>

<script>
  const TRANSLATIONS = {
    en: {
      tagline: 'Powered by Claude AI',
      heroTitle: 'Extract data from any document',
      heroSubtitle: 'Upload invoices, contracts, receipts or any business document — AI extracts all relevant data instantly',
      apiKeyLabel: 'Anthropic API Key',
      btnSave: 'Save',
      uploadTitle: 'Drop your document here',
      uploadSubtitle: 'or click to browse files',
      processingText: 'AI is analyzing your document...',
      resultsTitle: 'Extracted Data',
      btnNew: '+ New Document',
      btnExport: '⬇ Export Excel',
      alertNoKey: 'Please enter your API key',
      alertKeySaved: 'API key saved!',
      alertNoKeyUpload: 'Please enter your Anthropic API key first.',
      errorExport: 'Error exporting Excel: ',
      cardKeyFields: 'Key Fields',
      cardIssuer: 'Issuer / From',
      cardRecipient: 'Recipient / To',
      cardLineItems: 'Line Items',
      cardAdditional: 'Additional Info',
      thDesc: 'Description', thQty: 'Qty', thUnit: 'Unit Price', thTotal: 'Total',
    },
    es: {
      tagline: 'Impulsado por Claude AI',
      heroTitle: 'Extrae datos de cualquier documento',
      heroSubtitle: 'Sube facturas, contratos, recibos o cualquier documento de negocio — la IA extrae todos los datos al instante',
      apiKeyLabel: 'Clave API de Anthropic',
      btnSave: 'Guardar',
      uploadTitle: 'Arrastra tu documento aquí',
      uploadSubtitle: 'o haz clic para buscar archivos',
      processingText: 'La IA está analizando tu documento...',
      resultsTitle: 'Datos Extraídos',
      btnNew: '+ Nuevo Documento',
      btnExport: '⬇ Exportar Excel',
      alertNoKey: 'Por favor ingresa tu clave API',
      alertKeySaved: '¡Clave API guardada!',
      alertNoKeyUpload: 'Por favor ingresa tu clave API de Anthropic primero.',
      errorExport: 'Error al exportar Excel: ',
      cardKeyFields: 'Campos Clave',
      cardIssuer: 'Emisor / De',
      cardRecipient: 'Receptor / Para',
      cardLineItems: 'Artículos',
      cardAdditional: 'Info Adicional',
      thDesc: 'Descripción', thQty: 'Cant.', thUnit: 'Precio Unit.', thTotal: 'Total',
    },
    pt: {
      tagline: 'Desenvolvido por Claude AI',
      heroTitle: 'Extraia dados de qualquer documento',
      heroSubtitle: 'Carregue faturas, contratos, recibos ou qualquer documento comercial — a IA extrai todos os dados instantaneamente',
      apiKeyLabel: 'Chave API da Anthropic',
      btnSave: 'Salvar',
      uploadTitle: 'Arraste seu documento aqui',
      uploadSubtitle: 'ou clique para procurar arquivos',
      processingText: 'A IA está analisando seu documento...',
      resultsTitle: 'Dados Extraídos',
      btnNew: '+ Novo Documento',
      btnExport: '⬇ Exportar Excel',
      alertNoKey: 'Por favor insira sua chave API',
      alertKeySaved: 'Chave API salva!',
      alertNoKeyUpload: 'Por favor insira sua chave API da Anthropic primeiro.',
      errorExport: 'Erro ao exportar Excel: ',
      cardKeyFields: 'Campos Chave',
      cardIssuer: 'Emissor / De',
      cardRecipient: 'Destinatário / Para',
      cardLineItems: 'Itens',
      cardAdditional: 'Info Adicional',
      thDesc: 'Descrição', thQty: 'Qtd.', thUnit: 'Preço Unit.', thTotal: 'Total',
    },
    fr: {
      tagline: 'Propulsé par Claude AI',
      heroTitle: 'Extrayez les données de n\'importe quel document',
      heroSubtitle: 'Téléchargez des factures, contrats, reçus ou tout document commercial — l\'IA extrait toutes les données instantanément',
      apiKeyLabel: 'Clé API Anthropic',
      btnSave: 'Sauvegarder',
      uploadTitle: 'Déposez votre document ici',
      uploadSubtitle: 'ou cliquez pour parcourir les fichiers',
      processingText: 'L\'IA analyse votre document...',
      resultsTitle: 'Données Extraites',
      btnNew: '+ Nouveau Document',
      btnExport: '⬇ Exporter Excel',
      alertNoKey: 'Veuillez entrer votre clé API',
      alertKeySaved: 'Clé API sauvegardée!',
      alertNoKeyUpload: 'Veuillez d\'abord entrer votre clé API Anthropic.',
      errorExport: 'Erreur lors de l\'export Excel: ',
      cardKeyFields: 'Champs Clés',
      cardIssuer: 'Émetteur / De',
      cardRecipient: 'Destinataire / À',
      cardLineItems: 'Articles',
      cardAdditional: 'Info Supplémentaire',
      thDesc: 'Description', thQty: 'Qté', thUnit: 'Prix Unit.', thTotal: 'Total',
    }
  };

  let currentLang = localStorage.getItem('lang') || 'en';
  let currentData = null;
  let currentFilename = null;

  function t(key) { return TRANSLATIONS[currentLang][key] || key; }

  function setLang(lang) {
    currentLang = lang;
    localStorage.setItem('lang', lang);
    document.querySelectorAll('.lang-btn').forEach(b => {
      b.classList.toggle('active', b.textContent === lang.toUpperCase());
    });
    applyTranslations();
  }

  function applyTranslations() {
    document.getElementById('tagline').textContent = t('tagline');
    document.getElementById('heroTitle').textContent = t('heroTitle');
    document.getElementById('heroSubtitle').textContent = t('heroSubtitle');
    document.getElementById('apiKeyLabel').textContent = t('apiKeyLabel');
    document.getElementById('btnSave').textContent = t('btnSave');
    document.getElementById('uploadTitle').textContent = t('uploadTitle');
    document.getElementById('uploadSubtitle').textContent = t('uploadSubtitle');
    document.getElementById('processingText').textContent = t('processingText');
    document.getElementById('resultsTitle').textContent = t('resultsTitle');
    document.getElementById('btnNew').textContent = t('btnNew');
    document.getElementById('btnExport').textContent = t('btnExport');
    if (currentData) renderResults(currentData);
  }

  // Init
  const savedKey = localStorage.getItem('anthropic_api_key');
  if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
  setLang(currentLang);

  function saveApiKey() {
    const key = document.getElementById('apiKeyInput').value.trim();
    if (!key) return alert(t('alertNoKey'));
    localStorage.setItem('anthropic_api_key', key);
    alert(t('alertKeySaved'));
  }

  const uploadArea = document.getElementById('uploadArea');
  uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
  uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
  uploadArea.addEventListener('drop', e => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) processFile(file);
  });

  document.getElementById('fileInput').addEventListener('change', e => {
    if (e.target.files[0]) processFile(e.target.files[0]);
  });

  async function processFile(file) {
    const apiKey = document.getElementById('apiKeyInput').value.trim();
    if (!apiKey) { showError(t('alertNoKeyUpload')); return; }
    localStorage.setItem('anthropic_api_key', apiKey);
    hideError();
    showProcessing();
    const formData = new FormData();
    formData.append('file', file);
    try {
      const response = await fetch('/extract', {
        method: 'POST',
        headers: { 'X-API-Key': apiKey },
        body: formData
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.detail || 'Error processing document');
      currentData = result.data;
      currentFilename = result.filename;
      renderResults(result.data);
      showResults();
    } catch (err) {
      hideProcessing();
      showError(err.message);
    }
  }

  function renderResults(data) {
    const container = document.getElementById('resultsContent');
    let html = '';
    if (data.document_type) html += `<div class="doc-type-badge">${data.document_type}</div>`;
    if (data.summary) html += `<p class="summary-text">${data.summary}</p>`;

    const kf = data.key_fields || {};
    const kfEntries = Object.entries(kf).filter(([, v]) => v);
    if (kfEntries.length) {
      html += `<div class="card"><div class="card-title">${t('cardKeyFields')}</div>`;
      kfEntries.forEach(([k, v]) => {
        html += `<div class="field-row"><span class="field-label">${formatLabel(k)}</span><span class="field-value">${v}</span></div>`;
      });
      html += `</div>`;
    }

    const issuer = data.parties?.issuer || {};
    const recipient = data.parties?.recipient || {};
    const issuerEntries = Object.entries(issuer).filter(([, v]) => v);
    if (issuerEntries.length) {
      html += `<div class="card"><div class="card-title">${t('cardIssuer')}</div>`;
      issuerEntries.forEach(([k, v]) => {
        html += `<div class="field-row"><span class="field-label">${formatLabel(k)}</span><span class="field-value">${v}</span></div>`;
      });
      html += `</div>`;
    }

    const recipientEntries = Object.entries(recipient).filter(([, v]) => v);
    if (recipientEntries.length) {
      html += `<div class="card"><div class="card-title">${t('cardRecipient')}</div>`;
      recipientEntries.forEach(([k, v]) => {
        html += `<div class="field-row"><span class="field-label">${formatLabel(k)}</span><span class="field-value">${v}</span></div>`;
      });
      html += `</div>`;
    }

    const items = data.line_items || [];
    if (items.length) {
      html += `<div class="card"><div class="card-title">${t('cardLineItems')}</div>
        <table>
          <thead><tr><th>${t('thDesc')}</th><th>${t('thQty')}</th><th>${t('thUnit')}</th><th>${t('thTotal')}</th></tr></thead>
          <tbody>`;
      items.forEach(item => {
        html += `<tr>
          <td>${item.description || ''}</td>
          <td>${item.quantity || ''}</td>
          <td>${item.unit_price || ''}</td>
          <td>${item.total || ''}</td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
    }

    const ai = data.additional_info || {};
    const aiEntries = Object.entries(ai).filter(([, v]) => v);
    if (aiEntries.length) {
      html += `<div class="card"><div class="card-title">${t('cardAdditional')}</div>`;
      aiEntries.forEach(([k, v]) => {
        html += `<div class="field-row"><span class="field-label">${formatLabel(k)}</span><span class="field-value">${v}</span></div>`;
      });
      html += `</div>`;
    }

    container.innerHTML = html;
  }

  async function exportExcel() {
    if (!currentData) return;
    try {
      const response = await fetch('/export-excel', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: currentData, filename: currentFilename })
      });
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = currentFilename.replace(/\.[^.]+$/, '') + '_extracted.xlsx';
      a.click();
      URL.revokeObjectURL(url);
    } catch (err) {
      showError(t('errorExport') + err.message);
    }
  }

  function formatLabel(key) {
    return key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  function showProcessing() {
    document.getElementById('uploadArea').style.display = 'none';
    document.getElementById('processing').style.display = 'block';
    document.getElementById('results').style.display = 'none';
  }

  function showResults() {
    document.getElementById('processing').style.display = 'none';
    document.getElementById('results').style.display = 'block';
  }

  function hideProcessing() {
    document.getElementById('processing').style.display = 'none';
    document.getElementById('uploadArea').style.display = 'block';
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function hideError() {
    document.getElementById('errorMsg').style.display = 'none';
  }

  function resetApp() {
    currentData = null;
    currentFilename = null;
    document.getElementById('results').style.display = 'none';
    document.getElementById('uploadArea').style.display = 'block';
    document.getElementById('fileInput').value = '';
    hideError();
  }
</script>
</body>
</html>
